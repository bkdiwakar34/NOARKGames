[project]
name = "noarkgames"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	# <5: the tracker's fisheye calibration code (cv2.fisheye.CALIB_* flags)
	# targets OpenCV 4.x's API; OpenCV 5.0 restructured/removed these.
	"opencv-contrib-python>=4.13.0.92,<5",
	"scipy>=1.17.1",
	"toml>=0.10.2",
]

# This is a Godot project, not a Python package — pyproject.toml exists only
# to declare pyscripts/'s dependencies. Without this, setuptools' automatic
# package discovery finds every top-level folder (v2/, rcam/, Games/, ...)
# and refuses to build.
[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
